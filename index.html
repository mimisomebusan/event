<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>MIMISOME Clinic Busan Deokcheon | AUGUST</title>
<meta name="description" content="1–31 Aug 2026 · August Event · Choose your language">

<meta property="og:type" content="website">
<meta property="og:title" content="MIMISOME Clinic Busan Deokcheon | AUGUST">
<meta property="og:description" content="1–31 Aug 2026 · August Event · Choose your language">
<!-- ▼ OG 이미지 — 배포 위치에 맞는 절대주소로 교체하세요 -->
<meta property="og:image" content="https://mimisomebusan.github.io/event/og-1200x630-en.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- 이벤트 페이지와 동일: Outfit + Pretendard + 언어별 산세리프 -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Noto+Sans+JP:wght@500;700&family=Noto+Sans+TC:wght@500;700&family=Noto+Sans+SC:wght@500;700&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.css">

<style>
/* ============================================================
   MIMISOME AUGUST — Fresh Editorial
   웜 화이트 캔버스 + 아쿠아/핑크 소프트 컬러필드
   딥틸 타이포 · 헤어라인 화이트 카드 · 필 뱃지
   ============================================================ */
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}

:root{
  /* 이벤트 페이지 팔레트 그대로 */
  --canvas:    #FDF6F4;   /* 이벤트 페이지 body 배경 */
  --teal:      #053B47;
  --teal-mid:  #006B7E;
  --teal-soft: #4E8E9B;
  --aqua:      #5CD2D9;
  --aqua-pale: #DCF6FA;
  --pink:      #FFB3C4;
  --orange:    #FF8C1A;
  --cream:     #FFF3E4;
  --white:     #FFFFFF;

  --line:      rgba(5,59,71,.10);
  --ink-mute:  rgba(5,59,71,.55);
  --ink-faint: rgba(5,59,71,.38);

  --f-en: 'Outfit', sans-serif;
  --f-kr: 'Pretendard Variable','Pretendard','Apple SD Gothic Neo',sans-serif;
  --f-jp: 'Noto Sans JP','Hiragino Kaku Gothic ProN',sans-serif;
  --f-tc: 'Noto Sans TC','PingFang TC',sans-serif;
  --f-sc: 'Noto Sans SC','PingFang SC',sans-serif;

  --ease: cubic-bezier(.16,1,.3,1);
  --ease-out: cubic-bezier(0.25,0.46,0.45,0.94);
}

html,body{height:100%;}
body{
  font-family:var(--f-en);
  background:var(--canvas);
  color:var(--teal);
  min-height:100vh;
  min-height:100dvh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:40px 24px;
  position:relative;
  overflow:hidden;
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}

/* ── 컬러필드 — 상큼함은 여기서만.
   커다란 블러 색면이 웜 화이트 위에서 아주 천천히 숨쉼.
   형태가 없으니 유치하지 않고, 채도는 공기처럼만. ── */
.field{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;}
.field__aqua{
  position:absolute;
  top:-22vh;right:-24vw;
  width:78vw;height:70vh;
  min-width:420px;min-height:380px;
  border-radius:50%;
  background:radial-gradient(circle at 40% 55%, rgba(92,210,217,.34), rgba(92,210,217,.14) 50%, transparent 72%);
  filter:blur(40px);
  animation:breatheA 16s ease-in-out infinite;
}
.field__pink{
  position:absolute;
  bottom:-26vh;left:-22vw;
  width:72vw;height:64vh;
  min-width:380px;min-height:340px;
  border-radius:50%;
  background:radial-gradient(circle at 60% 40%, rgba(255,179,196,.30), rgba(255,179,196,.12) 50%, transparent 72%);
  filter:blur(40px);
  animation:breatheB 19s ease-in-out infinite;
}
.field__sun{
  position:absolute;
  top:16vh;left:-10vw;
  width:34vw;height:30vh;
  min-width:220px;min-height:200px;
  border-radius:50%;
  background:radial-gradient(circle, rgba(255,207,110,.20), transparent 70%);
  filter:blur(36px);
  animation:breatheA 22s ease-in-out infinite reverse;
}
@keyframes breatheA{
  0%,100%{transform:translate(0,0) scale(1);}
  50%{transform:translate(-3%,3%) scale(1.05);}
}
@keyframes breatheB{
  0%,100%{transform:translate(0,0) scale(1);}
  50%{transform:translate(3%,-3%) scale(1.06);}
}
@media (prefers-reduced-motion: reduce){
  .field__aqua,.field__pink,.field__sun{animation:none;}
}

/* ── Stage ─────────────────────────────────────── */
.stage{
  position:relative;z-index:1;
  width:100%;
  max-width:380px;
  text-align:center;
  display:flex;flex-direction:column;
  align-items:center;
  animation:stageIn .9s var(--ease) both;
}
@keyframes stageIn{
  from{opacity:0;transform:translateY(12px);}
  to{opacity:1;transform:translateY(0);}
}
.stage.leaving{animation:stageOut .6s cubic-bezier(0.55,0.085,0.68,0.53) forwards;}
@keyframes stageOut{to{opacity:0;transform:translateY(-10px);}}

/* ── 브랜드 아이브로우 — 오렌지 도트 + 트래킹 캡 ── */
.brand{
  display:inline-flex;align-items:center;gap:8px;
  white-space:nowrap;
  margin-bottom:14px;
  opacity:0;
  animation:rise .8s var(--ease) .1s forwards;
}
.brand__dot{
  width:5px;height:5px;border-radius:50%;
  background:var(--orange);
  flex:none;
}
.brand__label{
  font-size:10.5px;font-weight:600;
  letter-spacing:.18em;
  color:var(--teal);
}

/* ── 히어로 — 이벤트 페이지 히어로 스펙 그대로 ── */
.hero{
  font-family:var(--f-en);
  font-weight:700;
  line-height:.86;
  letter-spacing:-.045em;
  font-size:clamp(58px,16vw,80px);
  color:var(--teal);
  margin-bottom:16px;
  opacity:0;
  animation:rise .9s var(--ease) .2s forwards;
}

/* ── 기간 필 뱃지 — 이벤트 페이지 그대로 ── */
.pill{
  display:inline-block;
  font-size:clamp(12px,3.2vw,13.5px);
  font-weight:700;
  letter-spacing:.12em;
  color:var(--cream);
  background:var(--teal);
  padding:7px 15px;
  border-radius:999px;
  white-space:nowrap;
  margin-bottom:26px;
  opacity:0;
  animation:rise .9s var(--ease) .32s forwards;
}

/* ── 다국어 안내 순환 — 세로 라이즈 ── */
.eyebrow{
  position:relative;
  height:24px;width:100%;max-width:300px;
  margin-bottom:18px;
  overflow:hidden;
  opacity:0;
  animation:fade .9s var(--ease) .44s forwards;
}
.eyebrow__slot{
  position:absolute;top:0;left:0;right:0;height:100%;
  display:flex;align-items:center;justify-content:center;
  white-space:nowrap;pointer-events:none;
  transform:translateY(24px);opacity:0;
  transition:transform 1.2s cubic-bezier(0.65,0,0.35,1),opacity 1.2s cubic-bezier(0.65,0,0.35,1);
  font-weight:500;font-size:13px;
  letter-spacing:.01em;
  color:var(--ink-mute);
  line-height:1;
}
.eyebrow__slot.active{transform:translateY(0);opacity:1;}
.eyebrow__slot.exiting{transform:translateY(-24px);opacity:0;}
.eyebrow__slot.en{font-family:var(--f-en);letter-spacing:.04em;}
.eyebrow__slot.ko{font-family:var(--f-kr);}
.eyebrow__slot.jp{font-family:var(--f-jp);}
.eyebrow__slot.tw{font-family:var(--f-tc);}
.eyebrow__slot.cn{font-family:var(--f-sc);}

/* ── 언어 카드 — 정제된 화이트 카드 ──────────────
   헤어라인 보더 + 확산 그림자, 좌측 언어명 / 우측 코드+화살표.
   호버: 보더가 아쿠아로, 살짝 떠오름.
   선택: 딥틸 반전(기간 뱃지와 같은 문법). ─────── */
.lang-list{
  width:100%;
  display:flex;flex-direction:column;
  gap:9px;
  margin-bottom:26px;
}
.lang-item{
  position:relative;
  display:flex;align-items:center;justify-content:space-between;
  gap:12px;
  width:100%;
  min-height:56px;
  padding:15px 22px;
  background:var(--white);
  border:1px solid var(--line);
  border-radius:16px;
  text-decoration:none;
  box-shadow:0 2px 12px rgba(5,59,71,.05);
  cursor:pointer;
  opacity:0;
  transform:translateY(8px);
  transition:
    transform .35s var(--ease),
    border-color .35s var(--ease),
    box-shadow .35s var(--ease),
    background .35s var(--ease),
    opacity .45s var(--ease);
}
.lang-item:nth-child(1){animation:cardIn .7s var(--ease) .54s forwards;}
.lang-item:nth-child(2){animation:cardIn .7s var(--ease) .62s forwards;}
.lang-item:nth-child(3){animation:cardIn .7s var(--ease) .70s forwards;}
.lang-item:nth-child(4){animation:cardIn .7s var(--ease) .78s forwards;}
.lang-item:nth-child(5){animation:cardIn .7s var(--ease) .86s forwards;}
@keyframes cardIn{
  from{opacity:0;transform:translateY(8px);}
  to{opacity:1;transform:translateY(0);}
}

.lang-name{
  font-size:16.5px;
  font-weight:600;
  letter-spacing:-.015em;
  color:var(--teal);
  transition:color .3s var(--ease);
}
.lang-item.en .lang-name{font-family:var(--f-en);}
.lang-item.ko .lang-name{font-family:var(--f-kr);}
.lang-item.jp .lang-name{font-family:var(--f-jp);font-size:15.5px;}
.lang-item.tw .lang-name{font-family:var(--f-tc);font-size:15.5px;}
.lang-item.cn .lang-name{font-family:var(--f-sc);font-size:15.5px;}

/* 우측 메타 — 언어 코드 + 화살표 */
.lang-meta{
  display:inline-flex;align-items:center;gap:9px;
  flex:none;
}
.lang-code{
  font-family:var(--f-en);
  font-size:10px;font-weight:600;
  letter-spacing:.18em;
  color:var(--teal-soft);
  transition:color .3s var(--ease);
}
.lang-arrow{
  width:14px;height:14px;
  flex:none;
  stroke:var(--teal-soft);
  stroke-width:1.6;
  fill:none;
  stroke-linecap:round;
  stroke-linejoin:round;
  transition:stroke .3s var(--ease), transform .35s var(--ease);
}

/* 호버 */
@media(hover:hover){
  .lang-item:hover{
    transform:translateY(-2px);
    border-color:rgba(92,210,217,.65);
    box-shadow:0 8px 22px rgba(0,107,126,.10);
  }
  .lang-item:hover .lang-arrow{transform:translateX(2px);stroke:var(--teal-mid);}
  .lang-item:hover .lang-code{color:var(--teal-mid);}
  .lang-list:has(.lang-item:hover) .lang-item:not(:hover){opacity:.6;}
}
.lang-item:active{transform:translateY(0);box-shadow:0 1px 6px rgba(5,59,71,.06);}

/* 선택 — 딥틸 반전 점화 */
.lang-item.selected{
  background:var(--teal);
  border-color:var(--teal);
  box-shadow:0 8px 24px rgba(5,59,71,.22);
}
.lang-item.selected .lang-name{color:var(--cream);}
.lang-item.selected .lang-code{color:rgba(255,243,228,.65);}
.lang-item.selected .lang-arrow{stroke:rgba(255,243,228,.85);transform:translateX(3px);}
.lang-list:has(.lang-item.selected) .lang-item:not(.selected){opacity:.3;}

/* ── 하단 — 3색 헤어라인 + 시그니처 ── */
.stripe{
  width:56px;height:3px;
  border-radius:999px;
  background:linear-gradient(90deg, var(--orange) 0 33.333%, var(--pink) 0 66.666%, var(--aqua) 0);
  margin-bottom:12px;
  opacity:0;
  animation:rise .8s var(--ease) .98s forwards;
}
.footer{
  font-size:9.5px;
  font-weight:600;
  letter-spacing:.16em;
  color:var(--ink-faint);
  opacity:0;
  animation:rise .8s var(--ease) 1.06s forwards;
}

@keyframes rise{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}
@keyframes fade{from{opacity:0;}to{opacity:1;}}

/* ── 반응형 ── */
@media(max-width:380px){
  .stage{max-width:330px;}
}
@media(max-height:720px){
  .hero{font-size:clamp(50px,14vw,68px);margin-bottom:12px;}
  .pill{margin-bottom:20px;}
  .eyebrow{margin-bottom:14px;}
  .lang-list{gap:8px;margin-bottom:20px;}
  .lang-item{min-height:50px;padding:12px 20px;}
}
</style>
</head>
<body>

<!-- 컬러필드 -->
<div class="field">
  <div class="field__aqua"></div>
  <div class="field__pink"></div>
  <div class="field__sun"></div>
</div>

<!-- 메인 스테이지 -->
<div class="stage" id="stage">

  <!-- 브랜드 -->
  <div class="brand">
    <span class="brand__dot"></span>
    <span class="brand__label">MIMISOME BUSAN DEOKCHEON</span>
  </div>

  <!-- 히어로 -->
  <h1 class="hero">AUGUST</h1>

  <!-- 기간 뱃지 -->
  <div class="pill">2026.08.01 — 08.31</div>

  <!-- 다국어 안내 순환 · en → ko → tw → jp → cn -->
  <div class="eyebrow" id="eyebrow">
    <span class="eyebrow__slot en active">Choose your language</span>
    <span class="eyebrow__slot ko">언어를 선택해 주세요</span>
    <span class="eyebrow__slot tw">請選擇語言</span>
    <span class="eyebrow__slot jp">言語をお選びください</span>
    <span class="eyebrow__slot cn">请选择语言</span>
  </div>

  <!-- 언어 카드 -->
  <nav class="lang-list">
    <a class="lang-item ko" href="https://mimisomebusan.github.io/event/kr/" onclick="go(event,this)">
      <span class="lang-name">한국어</span>
      <span class="lang-meta">
        <span class="lang-code">KR</span>
        <svg class="lang-arrow" viewBox="0 0 16 16"><path d="M3 8h9M8.5 4.5 12 8l-3.5 3.5"/></svg>
      </span>
    </a>
    <a class="lang-item jp" href="https://mimisomebusan.github.io/event/jp/" onclick="go(event,this)">
      <span class="lang-name">日本語</span>
      <span class="lang-meta">
        <span class="lang-code">JP</span>
        <svg class="lang-arrow" viewBox="0 0 16 16"><path d="M3 8h9M8.5 4.5 12 8l-3.5 3.5"/></svg>
      </span>
    </a>
    <a class="lang-item tw" href="https://mimisomebusan.github.io/event/tw/" onclick="go(event,this)">
      <span class="lang-name">中文 · 繁體</span>
      <span class="lang-meta">
        <span class="lang-code">TW</span>
        <svg class="lang-arrow" viewBox="0 0 16 16"><path d="M3 8h9M8.5 4.5 12 8l-3.5 3.5"/></svg>
      </span>
    </a>
    <a class="lang-item cn" href="https://mimisomebusan.github.io/event/cn/" onclick="go(event,this)">
      <span class="lang-name">中文 · 简体</span>
      <span class="lang-meta">
        <span class="lang-code">CN</span>
        <svg class="lang-arrow" viewBox="0 0 16 16"><path d="M3 8h9M8.5 4.5 12 8l-3.5 3.5"/></svg>
      </span>
    </a>
    <a class="lang-item en" href="https://mimisomebusan.github.io/event/en/" onclick="go(event,this)">
      <span class="lang-name">English</span>
      <span class="lang-meta">
        <span class="lang-code">EN</span>
        <svg class="lang-arrow" viewBox="0 0 16 16"><path d="M3 8h9M8.5 4.5 12 8l-3.5 3.5"/></svg>
      </span>
    </a>
  </nav>

  <!-- 3색 스트라이프 + 푸터 -->
  <div class="stripe"></div>
  <div class="footer">AUGUST EVENT · MIMISOME CLINIC</div>

</div>

<script>
/* 다국어 안내 순환 — 세로 라이즈 */
(function(){
  const slots = [...document.querySelectorAll('.eyebrow__slot')];
  if(!slots.length) return;
  const TRANSITION = 1200;
  const SETTLED = 2100;
  const INTERVAL = TRANSITION + SETTLED;

  let i = 0;
  function step(){
    const current = slots[i];
    current.classList.remove('active');
    current.classList.add('exiting');
    i = (i + 1) % slots.length;
    slots[i].classList.add('active');
    setTimeout(() => { current.classList.remove('exiting'); }, TRANSITION + 50);
  }
  setInterval(step, INTERVAL);
})();

/* 언어 클릭 → 딥틸 반전 점화 → 페이드아웃 → 이동 */
function go(e, el){
  e.preventDefault();
  const url = el.getAttribute('href');
  el.classList.add('selected');
  setTimeout(function(){
    document.getElementById('stage').classList.add('leaving');
  }, 320);
  setTimeout(function(){
    window.location.href = url;
  }, 800);
}
</script>

</body>
</html>
